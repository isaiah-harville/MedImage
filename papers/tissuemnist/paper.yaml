title: "Three Seeds of a ConvNeXt-Small Recipe Score Above the Best Published TissueMNIST Results"
description: >-
  Over three seeds, a ConvNeXt-Small pretrained on ImageNet-22k reached a mean TissueMNIST
  test AUROC of 0.9637 (SD 0.0007) and accuracy of 0.7823, above the best published 3-run
  means (0.9585 and 0.7592). The paper compares the training setup item by item with
  MedMNIST+, rules out input size as the cause, and says how TissueMNIST was chosen from
  twelve subsets.
project: tissuemnist-convnext
