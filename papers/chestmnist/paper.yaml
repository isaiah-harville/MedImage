title: "Candidate Reasons for a Higher ChestMNIST AUROC: How an ImageNet-22k ConvNeXt-Small Recipe Differs from MedMNIST+"
description: >-
  On ChestMNIST at 224 pixels, one run of a ConvNeXt-Small pretrained on ImageNet-22k
  reached a test macro AUROC of 0.8416 (95% CI 0.8369 to 0.8461), above the best published
  0.823. The paper compares our training recipe with the MedMNIST+ setup line by line and
  names the experiment that would test each difference. Accuracy did not improve, and the
  paper says why.
