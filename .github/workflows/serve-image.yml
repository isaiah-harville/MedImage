name: Serve image

on:
  push:
    branches: [main]
    paths:
      - src/**
      - pyproject.toml
      - uv.lock
      - Dockerfile.serve
      - .dockerignore
      - .github/workflows/serve-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: serve-image-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # A sortable tag (UTC time, then commit) that Flux image automation in the homelab repo
      # watches; it pins the newest one there, so this workflow never pushes to main.
      - id: stamp
        run: echo "tag=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.serve
          push: true
          tags: |
            ghcr.io/isaiah-harville/opendiagnostics-serve:main
            ghcr.io/isaiah-harville/opendiagnostics-serve:sha-${{ github.sha }}
            ghcr.io/isaiah-harville/opendiagnostics-serve:${{ steps.stamp.outputs.tag }}
