name: Serve image

on:
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/bundle_models.py
      - models/*/runs/**
      - pyproject.toml
      - uv.lock
      - Dockerfile.serve
      - .dockerignore
      - .github/workflows/serve-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: serve-image-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      # Copies each project's latest published run files; the pod downloads checkpoints.
      # Until a run is published there is nothing to serve.
      - name: Bundle the published models
        id: bundle
        run: |
          status=0
          uv run --no-project --with pyyaml python scripts/bundle_models.py weights || status=$?
          if [ "$status" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 3 ]; then
            echo "::notice::No published run yet; skipping the image."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi
      # A sortable tag (UTC time, then commit) that Flux image automation in the homelab repo
      # watches; it pins the newest one there, so this workflow never pushes to main.
      - if: steps.bundle.outputs.ready == 'true'
        id: stamp
        run: echo "tag=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - if: steps.bundle.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.bundle.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.bundle.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.serve
          push: true
          tags: |
            ghcr.io/isaiah-harville/opendiagnostics-serve:main
            ghcr.io/isaiah-harville/opendiagnostics-serve:sha-${{ github.sha }}
            ghcr.io/isaiah-harville/opendiagnostics-serve:${{ steps.stamp.outputs.tag }}
