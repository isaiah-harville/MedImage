name: Serve image

on:
  push:
    branches: [main]
    paths:
      - src/**
      - scripts/bundle_models.py
      - models/*/runs/**
      - pyproject.toml
      - uv.lock
      - Dockerfile.serve
      - .dockerignore
      - .github/workflows/serve-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: serve-image-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      # Downloads each published run's checkpoint from the URL in its artifacts.yaml and
      # checks the SHA-256. Until a run has a URL there is nothing to serve.
      - name: Bundle the published models
        id: bundle
        run: |
          if uv run --no-project --with pyyaml python scripts/bundle_models.py weights; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No published run has a downloadable checkpoint yet; skipping the image."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.bundle.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.bundle.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.bundle.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.serve
          push: true
          tags: |
            ghcr.io/isaiah-harville/opendiagnostics-serve:main
            ghcr.io/isaiah-harville/opendiagnostics-serve:sha-${{ github.sha }}
      # Flux deploys whatever tag the kustomization names; pin it to this build.
      - name: Update the GitOps image tag
        if: steps.bundle.outputs.ready == 'true'
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          sed -i "/name: ghcr.io\/isaiah-harville\/opendiagnostics-serve$/{n;s/newTag: .*/newTag: ${IMAGE_TAG}/}" deploy/k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/kustomization.yaml
          git commit -m "chore(serve): deploy ${IMAGE_TAG}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
