name: Web image

on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/web-image.yml
  pull_request:
    paths:
      - web/**
      - .github/workflows/web-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check

  image:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: web-image-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ghcr.io/isaiah-harville/opendiagnostics-web:main
            ghcr.io/isaiah-harville/opendiagnostics-web:sha-${{ github.sha }}
      # Flux deploys whatever tag the kustomization names; pin it to this build.
      - name: Update the GitOps image tag
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          sed -i "/name: ghcr.io\/isaiah-harville\/opendiagnostics-web$/{n;s/newTag: .*/newTag: ${IMAGE_TAG}/}" deploy/k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/kustomization.yaml
          git commit -m "chore(web): deploy ${IMAGE_TAG}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
