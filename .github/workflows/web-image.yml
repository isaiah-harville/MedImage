name: Web image

on:
  push:
    branches: [main]
    paths:
      - web/**
      - papers/**
      - .github/workflows/web-image.yml
  pull_request:
    paths:
      - web/**
      - papers/**
      - .github/workflows/web-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check

  image:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: web-image-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # A sortable tag (UTC time, then commit) that Flux image automation in the homelab repo
      # watches; it pins the newest one there, so this workflow never pushes to main.
      - id: stamp
        run: echo "tag=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          build-contexts: papers=./papers
          push: true
          tags: |
            ghcr.io/isaiah-harville/opendiagnostics-web:main
            ghcr.io/isaiah-harville/opendiagnostics-web:sha-${{ github.sha }}
            ghcr.io/isaiah-harville/opendiagnostics-web:${{ steps.stamp.outputs.tag }}
