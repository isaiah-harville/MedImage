name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ubuntu / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      # CPU-only torch keeps CI fast.
      - name: Install
        run: uv sync --locked --extra cpu
      - name: Format
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run ty check
      - name: Test
        run: uv run pytest -m "not network"
      - name: Build the docs
        run: uv run opendiagnostics notebook && uv run zensical build --clean
      - name: Smoke-train every task from the command line
        run: |
          for config in configs/smoke/*.yaml; do
            uv run opendiagnostics fit -c "$config" --output_dir "$RUNNER_TEMP/runs"
          done
