[project]
name = "medimage"
version = "0.1.0"
description = "A generic, reproducible PyTorch pipeline for medical image classification and detection."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Isaiah Harville" }]
keywords = ["medical-imaging", "pytorch", "deep-learning", "classification", "object-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "nibabel>=5.2",
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic>=2.9",
    "pydicom>=3.0",
    "pyyaml>=6.0",
    "timm>=1.0",
    "torch>=2.6",
    "torchvision>=0.21",
]

[project.optional-dependencies]
# MONAI supplies 3D networks. It is optional; see docs/design.md.
monai = ["monai>=1.4"]
# Accelerator choice for development with uv. Pick at most one:
#   uv sync --extra cpu      (CI, laptops)
#   uv sync --extra cu132    (NVIDIA GPUs, CUDA 13.2)
# A plain `pip install medimage` takes torch from PyPI as usual.
cpu = ["torch>=2.6", "torchvision>=0.21"]
cu132 = ["torch>=2.6", "torchvision>=0.21"]

[project.scripts]
medimage = "medimage.cli:main"

[project.urls]
Repository = "https://github.com/isaiah-harville/MedImage"

[dependency-groups]
dev = [
    "pycocotools>=2.0.8",
    "pytest>=8.3",
    "ruff>=0.8",
    "scikit-learn>=1.5",
    "ty>=0.0.111",
    "xpt>=0.2.0",
]
docs = [
    "matplotlib>=3.9",
    "mkdocstrings-python>=1.12",
    "zensical>=0.1.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medimage"]

[tool.uv]
default-groups = ["dev", "docs"]
conflicts = [[{ extra = "cpu" }, { extra = "cu132" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PT"]
ignore = ["E501", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "network: needs internet access (deselect with -m 'not network')",
    "slow: takes more than a few seconds",
]
filterwarnings = ["error::UserWarning:medimage.*"]
