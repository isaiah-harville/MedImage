[project]
name = "opendiagnostics"
version = "0.1.0"
description = "Open research models for medical image diagnosis. Not a medical device. PyTorch models and a reproducible pipeline for medical image classification and detection."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Isaiah Harville" }]
keywords = ["medical-imaging", "pytorch", "deep-learning", "classification", "object-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "boto3>=1.36",
    "captum>=0.8",
    "h5py>=3.10",
    "jsonargparse[signatures]>=4.40",
    "lightning>=2.5",
    "medmnist>=3.0",
    "monai>=1.4",
    "nibabel>=5.2",
    "numpy>=1.26",
    "openslide-bin>=4.0.0.6",
    "openslide-python>=1.4.1",
    "pillow>=10.0",
    "pycocotools>=2.0.8",
    "pydantic>=2.9",
    "pydicom>=3.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "timm>=1.0",
    "torch>=2.6",
    "torchmetrics>=1.6",
    "torchvision>=0.21",
]

[project.optional-dependencies]
# Accelerator choice for development with uv. Pick at most one:
#   uv sync --extra cpu      (CI, laptops)
#   uv sync --extra cu132    (NVIDIA GPUs, CUDA 13.2)
# A plain `pip install opendiagnostics` takes torch from PyPI as usual.
cpu = ["torch>=2.6", "torchvision>=0.21"]
cu132 = ["torch>=2.6", "torchvision>=0.21"]
serve = [
    "fastapi>=0.115",
    "litserve>=0.2.19",
]

[project.scripts]
opendiagnostics = "opendiagnostics.cli:main"
opendiagnostics-serve = "opendiagnostics.serve:main"

[project.urls]
Repository = "https://github.com/isaiah-harville/opendiagnostics"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "openpyxl>=3.1",
    "pytest>=8.3",
    "ruff>=0.8",
    "ty>=0.0.111",
    "xpt>=0.3.0",
]
docs = [
    "matplotlib>=3.9",
    "mkdocstrings-python>=1.12",
    "zensical>=0.1.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendiagnostics"]

[tool.uv]
default-groups = ["dev", "docs"]
conflicts = [[{ extra = "cpu" }, { extra = "cu132" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PT"]
ignore = ["E501", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "network: needs internet access (deselect with -m 'not network')",
    "slow: takes more than a few seconds",
]
filterwarnings = ["error::UserWarning:opendiagnostics.*"]

[tool.ty.environment]
extra-paths = ["scripts/datasets"]
