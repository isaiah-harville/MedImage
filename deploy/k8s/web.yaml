# The demo frontend (web/), on traefik-public. Demo images and uploads; uploads are
# processed in memory and never stored (see web/src/routes/privacy).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opendiagnostics-web
  labels:
    app.kubernetes.io/name: opendiagnostics-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: opendiagnostics-demo
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: opendiagnostics-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opendiagnostics-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: opendiagnostics-demo
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/isaiah-harville/opendiagnostics-web:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: API_URL
              value: http://opendiagnostics-serve:8080
            # The site answers on diagnostics.harville.dev and diagnostics.harville.ai, so
            # its origin comes from each request as Traefik forwards it. SvelteKit rejects
            # form posts whose Origin does not match.
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            - name: HOST_HEADER
              value: host
            - name: ALLOW_UPLOADS
              value: "true"
            # Uploads are capped at 10 MB by the app; leave room for the form encoding.
            - name: BODY_SIZE_LIMIT
              value: "11M"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # RAM-backed, so nothing a library spools can reach the node's disk.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: opendiagnostics-web
  labels:
    app.kubernetes.io/name: opendiagnostics-web
spec:
  selector:
    app.kubernetes.io/name: opendiagnostics-web
  ports:
    - name: http
      port: 80
      targetPort: http
