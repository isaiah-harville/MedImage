# The inference API: LitServe (Dockerfile.serve), CPU only. The image holds no models: at
# startup it reads catalog.json from the in-cluster weights bucket and downloads the runs into
# a cache volume, checkpoints named by SHA-256, so it never downloads one twice. Every
# REFRESH_SECONDS it checks the catalog again and exits when it changed, so the pod restarts
# on the new models. It writes nothing else but /tmp, which is in memory. Uploads are never
# stored.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opendiagnostics-weights-cache
  labels:
    app.kubernetes.io/name: opendiagnostics-serve
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opendiagnostics-serve
  labels:
    app.kubernetes.io/name: opendiagnostics-serve
    app.kubernetes.io/part-of: opendiagnostics-demo
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # The cache volume is ReadWriteOnce, so the old pod must stop before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opendiagnostics-serve
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opendiagnostics-serve
        app.kubernetes.io/part-of: opendiagnostics-demo
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: serve
          image: ghcr.io/isaiah-harville/opendiagnostics-serve:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WEIGHTS_CACHE
              value: /cache
            - name: WEIGHTS_BASE_URL
              value: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333/opendiagnostics-weights
            - name: REFRESH_SECONDS
              value: "600"
            # Integrated Gradients is most of a prediction's cost. On two CPUs, 8 steps keep a
            # prediction well under the frontend's 90 s wait.
            - name: ATTRIBUTION_STEPS
              value: "8"
            - name: WORKERS
              value: "1"
            # One BLAS thread per CPU in the limit.
            - name: OMP_NUM_THREADS
              value: "2"
            # glibc gives each thread its own arena; with torch's threads that keeps freed
            # memory resident. Two arenas keep the worker near its measured working set.
            - name: MALLOC_ARENA_MAX
              value: "2"
          # The first start downloads every checkpoint (about 200 MB each) before serving.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              cpu: "2"
              # Measured: 12 models in the worker use about 3 GB, a prediction peaks near
              # 4.4 GB, and the API process adds about 0.6 GB.
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: opendiagnostics-weights-cache
        # RAM-backed, so nothing a library spools can reach the node's disk.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: opendiagnostics-serve
  labels:
    app.kubernetes.io/name: opendiagnostics-serve
spec:
  selector:
    app.kubernetes.io/name: opendiagnostics-serve
  ports:
    - name: http
      port: 8080
      targetPort: http
