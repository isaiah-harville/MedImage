# The inference API (Dockerfile.serve). CPU only. An init container downloads each model's
# checkpoint from the in-cluster weights bucket into a cache volume, named by SHA-256, so a
# restart or a new image downloads only checkpoints it has not seen. The API mounts the cache
# read-only and writes nothing but /tmp, which is in memory. Uploads are never stored.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opendiagnostics-weights-cache
  labels:
    app.kubernetes.io/name: opendiagnostics-serve
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opendiagnostics-serve
  labels:
    app.kubernetes.io/name: opendiagnostics-serve
    app.kubernetes.io/part-of: opendiagnostics-demo
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # The cache volume is ReadWriteOnce, so the old pod must stop before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opendiagnostics-serve
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opendiagnostics-serve
        app.kubernetes.io/part-of: opendiagnostics-demo
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch-weights
          image: ghcr.io/isaiah-harville/opendiagnostics-serve:main
          imagePullPolicy: IfNotPresent
          command: [opendiagnostics-fetch-weights]
          env:
            - name: WEIGHTS_CACHE
              value: /cache
            - name: WEIGHTS_BASE_URL
              value: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333/opendiagnostics-weights
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      containers:
        - name: serve
          image: ghcr.io/isaiah-harville/opendiagnostics-serve:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WEIGHTS_CACHE
              value: /cache
            - name: ATTRIBUTION_STEPS
              value: "16"
            - name: MAX_CONCURRENT
              value: "2"
            # One BLAS thread per CPU in the limit.
            - name: OMP_NUM_THREADS
              value: "2"
          # Loading every model takes up to a minute or two on CPU.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: cache
              mountPath: /cache
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: opendiagnostics-weights-cache
        # RAM-backed, so nothing a library spools can reach the node's disk.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: opendiagnostics-serve
  labels:
    app.kubernetes.io/name: opendiagnostics-serve
spec:
  selector:
    app.kubernetes.io/name: opendiagnostics-serve
  ports:
    - name: http
      port: 8080
      targetPort: http
