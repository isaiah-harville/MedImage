# The API takes traffic only from the two frontends and makes no outbound connections.
# Each frontend takes traffic only from its Traefik and talks only to DNS and the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opendiagnostics-serve
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opendiagnostics-serve
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: web
              app.kubernetes.io/part-of: opendiagnostics-demo
      ports:
        - protocol: TCP
          port: 8080
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opendiagnostics-web-public
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opendiagnostics-web-public
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-public
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opendiagnostics-serve
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opendiagnostics-web-internal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opendiagnostics-web-internal
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opendiagnostics-serve
      ports:
        - protocol: TCP
          port: 8080
