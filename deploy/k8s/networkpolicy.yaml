# The API takes traffic only from the frontend. Its only outbound connections are DNS and
# the SeaweedFS S3 port, where it downloads published models; the bucket allows anonymous
# reads of the weights bucket only.
# The frontend takes traffic only from traefik-public and talks only to DNS and the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opendiagnostics-serve
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opendiagnostics-serve
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: web
              app.kubernetes.io/part-of: opendiagnostics-demo
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: seaweedfs
      ports:
        - protocol: TCP
          port: 8333
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opendiagnostics-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opendiagnostics-web
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-public
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opendiagnostics-serve
      ports:
        - protocol: TCP
          port: 8080
