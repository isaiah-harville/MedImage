[project]
site_name = "MedImage lab notebook"
site_description = "Reproducible PyTorch models for medical image classification and detection"
site_url = "https://isaiah-harville.github.io/MedImage/"
repo_url = "https://github.com/isaiah-harville/MedImage"
repo_name = "isaiah-harville/MedImage"
docs_dir = "docs"
site_dir = "site"

[project.theme]
variant = "modern"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.instant",
  "toc.follow",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
tables = {}
admonition = {}
attr_list = {}
md_in_html = {}
"pymdownx.details" = {}
"pymdownx.highlight" = { anchor_linenums = true }
"pymdownx.superfences" = {}
toc = { permalink = true }
