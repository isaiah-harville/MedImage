[project]
site_name = "OpenDiagnostics lab notebook"
site_description = "Open research models for medical image diagnosis. Not a medical device."
site_url = "https://isaiah-harville.github.io/opendiagnostics/"
repo_url = "https://github.com/isaiah-harville/opendiagnostics"
repo_name = "isaiah-harville/opendiagnostics"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Guide" = "guide.md" },
  { "Lab notebook" = "notebook/index.md" },
  { "Datasets" = [
    "datasets.md",
    { "Bar to beat" = "benchmarks.md" },
    { "Chest X-ray" = "datasets/chest-xray.md" },
    { "MRI and CT" = "datasets/mri-ct.md" },
    { "Other modalities" = "datasets/other-modalities.md" },
  ] },
  { "Design" = "design.md" },
  { "Code reference" = [
    "reference/index.md",
    "reference/config.md",
    "reference/registry.md",
    "reference/data.md",
    "reference/io.md",
    "reference/transforms.md",
    "reference/datasets.md",
    "reference/models.md",
    "reference/tasks.md",
    "reference/metrics.md",
    "reference/engine.md",
    "reference/repro.md",
    "reference/publish.md",
    "reference/notebook.md",
    "reference/cli.md",
  ] },
]

[project.theme]
variant = "modern"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.instant",
  "toc.follow",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
tables = {}
admonition = {}
attr_list = {}
md_in_html = {}
"pymdownx.details" = {}
"pymdownx.highlight" = { anchor_linenums = true }
"pymdownx.superfences" = {}
toc = { permalink = true }

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_root_heading = true
show_root_full_path = true
show_source = true
members_order = "source"
show_signature_annotations = true
separate_signature = true
filters = ["!^_"]
show_if_no_docstring = true
heading_level = 2
