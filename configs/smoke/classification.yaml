# A seconds-long CPU run on generated 2D images. CI runs it to check the whole pipeline.
#   uv run opendiagnostics fit -c configs/smoke/classification.yaml
name: smoke-classification
seed_everything: 0
trainer:
  accelerator: cpu
  max_epochs: 3
  enable_progress_bar: false
model:
  class_path: opendiagnostics.modules.ImageClassifier
  init_args:
    network:
      class_path: timm.create_model
      init_args: {model_name: test_resnet}
      dict_kwargs: {num_classes: 1, in_chans: 1}
data:
  class_path: opendiagnostics.data.SyntheticClassificationDataModule
  init_args:
    num_samples: 160
    image_size: 32
    images_per_patient: 2
    split: patient
    fractions: [0.6, 0.2, 0.2]
    batch_size: 16
    train_transforms:
      class_path: torchvision.transforms.v2.RandomHorizontalFlip
optimizer:
  class_path: torch.optim.AdamW
  init_args: {lr: 0.003}
eval: {bootstrap_samples: 200}
