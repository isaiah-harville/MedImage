# Generated by scripts/segmentation_recipes.py. Edit the script, then rerun it.
#   uv run opendiagnostics fit -c models/totalsegmentator-dynunet/config.yaml
name: totalsegmentator-dynunet
notes: TotalSegmentator v2.0.1, all 117 structures at 3 mm, the official meta.csv split. The dataset has
  no patient IDs.
seed_everything: 0
trainer:
  accelerator: auto
  precision: bf16-mixed
  deterministic: warn
  max_epochs: 47
  check_val_every_n_epoch: 2
  gradient_clip_val: 12.0
  log_every_n_steps: 50
  callbacks:
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
model:
  class_path: opendiagnostics.modules.SegmentationModule
  init_args:
    patch_size:
    - 128
    - 128
    - 128
    network:
      class_path: monai.networks.nets.DynUNet
      init_args:
        spatial_dims: 3
        in_channels: 1
        out_channels: 118
        kernel_size:
        - - 3
          - 3
          - 3
        - - 3
          - 3
          - 3
        - - 3
          - 3
          - 3
        - - 3
          - 3
          - 3
        - - 3
          - 3
          - 3
        - - 3
          - 3
          - 3
        strides:
        - - 1
          - 1
          - 1
        - - 2
          - 2
          - 2
        - - 2
          - 2
          - 2
        - - 2
          - 2
          - 2
        - - 2
          - 2
          - 2
        - - 2
          - 2
          - 2
        upsample_kernel_size:
        - - 2
          - 2
          - 2
        - - 2
          - 2
          - 2
        - - 2
          - 2
          - 2
        - - 2
          - 2
          - 2
        - - 2
          - 2
          - 2
        norm_name: instance
        res_block: true
    sw_batch_size: 1
    overlap: 0.5
    ignore_empty: true
data:
  class_path: opendiagnostics.data.NiftiSegmentationDataModule
  init_args:
    manifest: data/totalsegmentator/manifest.csv
    class_names:
    - background
    - spleen
    - kidney_right
    - kidney_left
    - gallbladder
    - liver
    - stomach
    - pancreas
    - adrenal_gland_right
    - adrenal_gland_left
    - lung_upper_lobe_left
    - lung_lower_lobe_left
    - lung_upper_lobe_right
    - lung_middle_lobe_right
    - lung_lower_lobe_right
    - esophagus
    - trachea
    - thyroid_gland
    - small_bowel
    - duodenum
    - colon
    - urinary_bladder
    - prostate
    - kidney_cyst_left
    - kidney_cyst_right
    - sacrum
    - vertebrae_S1
    - vertebrae_L5
    - vertebrae_L4
    - vertebrae_L3
    - vertebrae_L2
    - vertebrae_L1
    - vertebrae_T12
    - vertebrae_T11
    - vertebrae_T10
    - vertebrae_T9
    - vertebrae_T8
    - vertebrae_T7
    - vertebrae_T6
    - vertebrae_T5
    - vertebrae_T4
    - vertebrae_T3
    - vertebrae_T2
    - vertebrae_T1
    - vertebrae_C7
    - vertebrae_C6
    - vertebrae_C5
    - vertebrae_C4
    - vertebrae_C3
    - vertebrae_C2
    - vertebrae_C1
    - heart
    - aorta
    - pulmonary_vein
    - brachiocephalic_trunk
    - subclavian_artery_right
    - subclavian_artery_left
    - common_carotid_artery_right
    - common_carotid_artery_left
    - brachiocephalic_vein_left
    - brachiocephalic_vein_right
    - atrial_appendage_left
    - superior_vena_cava
    - inferior_vena_cava
    - portal_vein_and_splenic_vein
    - iliac_artery_left
    - iliac_artery_right
    - iliac_vena_left
    - iliac_vena_right
    - humerus_left
    - humerus_right
    - scapula_left
    - scapula_right
    - clavicula_left
    - clavicula_right
    - femur_left
    - femur_right
    - hip_left
    - hip_right
    - spinal_cord
    - gluteus_maximus_left
    - gluteus_maximus_right
    - gluteus_medius_left
    - gluteus_medius_right
    - gluteus_minimus_left
    - gluteus_minimus_right
    - autochthon_left
    - autochthon_right
    - iliopsoas_left
    - iliopsoas_right
    - brain
    - skull
    - rib_left_1
    - rib_left_2
    - rib_left_3
    - rib_left_4
    - rib_left_5
    - rib_left_6
    - rib_left_7
    - rib_left_8
    - rib_left_9
    - rib_left_10
    - rib_left_11
    - rib_left_12
    - rib_right_1
    - rib_right_2
    - rib_right_3
    - rib_right_4
    - rib_right_5
    - rib_right_6
    - rib_right_7
    - rib_right_8
    - rib_right_9
    - rib_right_10
    - rib_right_11
    - rib_right_12
    - sternum
    - costal_cartilages
    image_columns:
    - image
    in_channels: 1
    patient_ids_available: false
    license: CC BY 4.0
    citation: 'Wasserthal, J. et al. TotalSegmentator: Robust Segmentation of 104 Anatomic Structures
      in CT Images. Radiology: Artificial Intelligence 5, e230024 (2023). Data v2.0.1: https://doi.org/10.5281/zenodo.10047292'
    split: predefined
    batch_size: 1
    num_workers: 6
    cache_dir: data/cache/totalsegmentator
    train_transforms:
      class_path: monai.transforms.Compose
      init_args:
        transforms:
        - class_path: monai.transforms.Orientationd
          init_args:
            keys:
            - image
            - label
            axcodes: RAS
            labels:
            - - L
              - R
            - - P
              - A
            - - I
              - S
        - class_path: monai.transforms.Spacingd
          init_args:
            keys:
            - image
            - label
            pixdim:
            - 3.0
            - 3.0
            - 3.0
            mode:
            - bilinear
            - nearest
        - class_path: monai.transforms.ScaleIntensityRanged
          init_args:
            keys:
            - image
            a_min: -1000
            a_max: 1000
            b_min: 0.0
            b_max: 1.0
            clip: true
        - class_path: monai.transforms.CastToTyped
          init_args:
            keys:
            - image
            dtype: float16
        - class_path: monai.transforms.SpatialPadd
          init_args:
            keys:
            - image
            - label
            spatial_size:
            - 128
            - 128
            - 128
        - class_path: monai.transforms.RandCropByPosNegLabeld
          init_args:
            keys:
            - image
            - label
            label_key: label
            spatial_size:
            - 128
            - 128
            - 128
            pos: 1.0
            neg: 1.0
            num_samples: 1
        - class_path: monai.transforms.RandScaleIntensityd
          init_args:
            keys:
            - image
            factors: 0.1
            prob: 0.5
        - class_path: monai.transforms.RandShiftIntensityd
          init_args:
            keys:
            - image
            offsets: 0.1
            prob: 0.5
    eval_transforms:
      class_path: monai.transforms.Compose
      init_args:
        transforms:
        - class_path: monai.transforms.Orientationd
          init_args:
            keys:
            - image
            - label
            axcodes: RAS
            labels:
            - - L
              - R
            - - P
              - A
            - - I
              - S
        - class_path: monai.transforms.Spacingd
          init_args:
            keys:
            - image
            pixdim:
            - 3.0
            - 3.0
            - 3.0
            mode: bilinear
        - class_path: monai.transforms.ScaleIntensityRanged
          init_args:
            keys:
            - image
            a_min: -1000
            a_max: 1000
            b_min: 0.0
            b_max: 1.0
            clip: true
        - class_path: monai.transforms.CastToTyped
          init_args:
            keys:
            - image
            dtype: float16
optimizer:
  class_path: torch.optim.SGD
  init_args:
    lr: 0.01
    momentum: 0.99
    nesterov: true
    weight_decay: 3.0e-05
lr_scheduler:
  class_path: torch.optim.lr_scheduler.PolynomialLR
  init_args:
    total_iters: 47
    power: 0.9
checkpoint:
  monitor: val/dice
  mode: max
eval:
  bootstrap_samples: 1000
