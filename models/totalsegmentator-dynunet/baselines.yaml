benchmark: TotalSegmentator v2.0.1, official test split from meta.csv, all 117 structures
protocol: 'Dice per structure, per case, averaged over the test cases that contain the structure: a structure
  absent from the reference is left out (ignore_empty), and one predicted empty scores 0, as in the TotalSegmentator
  repository''s resources/evaluate.py. The headline dice averages the 117 structures; the published file
  prints no overall mean, so only the per-structure values are listed and the leaderboard cannot rank
  it. The paper''s 0.943 (1.5 mm) and 0.840 (3 mm) are on v1''s 65-case test set with 104 classes and
  are not comparable.'
baselines:
