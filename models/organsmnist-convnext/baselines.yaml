    metrics: {auroc: 0.987, accuracy: 0.851}
    source: Manzari et al., arXiv 2502.13693v3 (2025), Table 5
    url: https://arxiv.org/html/2502.13693v3
  - method: "MedViT-S (224, resized)"
    metrics: {auroc: 0.987, accuracy: 0.805}
    source: Manzari et al., arXiv 2302.09462v1 (2023), Table 3
