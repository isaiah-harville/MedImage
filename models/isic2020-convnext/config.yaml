# Prepare the data once: uv run python scripts/datasets/isic2020.py data/isic2020
#   uv run opendiagnostics fit -c models/isic2020-convnext/config.yaml
name: isic2020-convnext
notes: ISIC 2020 melanoma vs benign at 384 px. Patient-level 70/15/15 split of the training data; the
  official test labels were never released.
seed_everything: 0
trainer:
  accelerator: auto
  precision: bf16-mixed
  deterministic: warn
  max_epochs: 15
  log_every_n_steps: 50
  callbacks:
  - class_path: lightning.pytorch.callbacks.EMAWeightAveraging
    init_args:
      decay: 0.999
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
model:
  class_path: opendiagnostics.modules.ImageClassifier
  init_args:
    network:
      class_path: timm.create_model
      init_args:
        model_name: convnext_small.fb_in22k_ft_in1k_384
        pretrained: true
      dict_kwargs:
        num_classes: 1
        in_chans: 3
        drop_path_rate: 0.2
    tta: true
data:
  class_path: opendiagnostics.data.CSVImageDataModule
  init_args:
    manifest: data/isic2020/manifest.csv
    split: predefined
    split_column: split
    class_names:
    - benign
    - melanoma
    in_channels: 3
    license: CC BY-NC 4.0
    citation: Rotemberg V, et al. A patient-centric dataset of images and metadata for identifying melanomas
      using clinical context. Sci Data 8:34 (2021). doi:10.1038/s41597-021-00815-z
    batch_size: 24
    eval_batch_size: 64
    num_workers: 8
    train_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
        - class_path: torchvision.transforms.v2.Resize
          init_args:
            size:
            - 384
            - 384
            antialias: true
        - class_path: torchvision.transforms.v2.RandomHorizontalFlip
        - class_path: torchvision.transforms.v2.RandomVerticalFlip
        - class_path: torchvision.transforms.v2.RandomAffine
          init_args:
            degrees: 180
            scale:
            - 0.9
            - 1.1
        - class_path: torchvision.transforms.v2.ColorJitter
          init_args:
            brightness: 0.1
            contrast: 0.1
            saturation: 0.1
        - class_path: torchvision.transforms.v2.Normalize
          init_args:
            mean:
            - 0.485
            - 0.456
            - 0.406
            std:
            - 0.229
            - 0.224
            - 0.225
    eval_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
        - class_path: torchvision.transforms.v2.Resize
          init_args:
            size:
            - 384
            - 384
            antialias: true
        - class_path: torchvision.transforms.v2.Normalize
          init_args:
            mean:
            - 0.485
            - 0.456
            - 0.406
            std:
            - 0.229
            - 0.224
            - 0.225
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.0001
    weight_decay: 0.05
lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 15
    eta_min: 1.0e-06
checkpoint:
  monitor: val/auroc
  mode: max
eval:
  bootstrap_samples: 1000
