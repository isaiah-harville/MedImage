# lightning.pytorch==2.6.6
seed_everything: 0
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: bf16-mixed
  logger: null
  callbacks:
  - class_path: lightning.pytorch.callbacks.EMAWeightAveraging
    init_args:
      device: null
      use_buffers: true
      decay: 0.9987
      update_every_n_steps: 1
      update_starting_at_step: null
      update_starting_at_epoch: null
      multi_avg_fn: null
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
      log_momentum: false
      log_weight_decay: false
  fast_dev_run: false
  max_epochs: 100
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 50
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: warn
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
  enable_autolog_hparams: true
  model_registry: null
model:
  class_path: opendiagnostics.modules.ImageClassifier
  init_args:
    network:
      class_path: opendiagnostics.networks.KineticsVideoResNet
      init_args:
        architecture: r3d_18
        num_classes: 1
        pretrained: true
    threshold: youden
    label_smoothing: 0.0
    pos_weight: null
    class_weight: null
    tta: true
    calibration_bins: 15
data:
  class_path: opendiagnostics.data.MedMNISTDataModule
  init_args:
    flag: synapsemnist3d
    size: 64
    root: data/medmnist
    download: true
    variant: null
    split: predefined
    fractions:
    - 0.7
    - 0.15
    - 0.15
    folds: 5
    fold: 0
    stratify: true
    split_seed: 0
    train_transforms:
      class_path: monai.transforms.Compose
      init_args:
        transforms:
        - class_path: monai.transforms.RandAffine
          init_args:
            prob: 0.8
            rotate_range:
            - 0.17
            - 0.17
            - 0.17
            shear_range: null
            translate_range:
            - 4
            - 4
            - 4
            scale_range:
            - 0.1
            - 0.1
            - 0.1
            spatial_size: null
            mode: BILINEAR
            padding_mode: border
            cache_grid: false
            device: null
            lazy: false
        - class_path: monai.transforms.RandFlip
          init_args:
            prob: 0.5
            spatial_axis: 0
            lazy: false
        - class_path: monai.transforms.RandFlip
          init_args:
            prob: 0.5
            spatial_axis: 1
            lazy: false
        - class_path: monai.transforms.RandFlip
          init_args:
            prob: 0.5
            spatial_axis: 2
            lazy: false
        map_items: true
        unpack_items: false
        log_stats: false
        lazy: false
        overrides: null
    eval_transforms: null
    batch_size: 16
    eval_batch_size: 64
    num_workers: 8
name: synapsemnist3d-r3d18
output_dir: runs
notes: SynapseMNIST3D at 64 voxels with a Kinetics-400-pretrained R3D-18, otherwise
  the recipe of synapsemnist3d-resnet18. Official split; MedMNIST has no patient IDs.
eval:
  bootstrap_samples: 1000
  confidence: 0.95
  bootstrap_unit: patient
  splits:
  - val
  - test
checkpoint:
  dirpath: null
  filename: checkpoint
  monitor: val/auroc
  verbose: false
  save_last: null
  save_top_k: 1
  save_on_exception: false
  save_weights_only: true
  mode: max
  auto_insert_metric_name: false
  every_n_train_steps: null
  train_time_interval: null
  every_n_epochs: null
  save_on_train_epoch_end: null
  enable_version_counter: false
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.001
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.05
    amsgrad: false
    maximize: false
    foreach: null
    capturable: false
    differentiable: false
    fused: null
lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 100
    eta_min: 1.0e-06
    last_epoch: -1
ckpt_path: null
weights_only: null
