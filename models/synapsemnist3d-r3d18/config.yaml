# The synapsemnist3d-resnet18 recipe with a Kinetics-400-pretrained R3D-18, as a baseline for
# the SynapseMNIST3D paper (papers/synapsemnist3d/).
#   uv run opendiagnostics fit -c models/synapsemnist3d-r3d18/config.yaml
name: synapsemnist3d-r3d18
notes: SynapseMNIST3D at 64 voxels with a Kinetics-400-pretrained R3D-18, otherwise the recipe of
  synapsemnist3d-resnet18. Official split; MedMNIST has no patient IDs.
seed_everything: 0
trainer:
  accelerator: auto
  precision: bf16-mixed
  deterministic: warn
  max_epochs: 100
  log_every_n_steps: 50
  callbacks:
  - class_path: lightning.pytorch.callbacks.EMAWeightAveraging
    init_args:
      decay: 0.9987
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
model:
  class_path: opendiagnostics.modules.ImageClassifier
  init_args:
    network:
      class_path: opendiagnostics.networks.KineticsVideoResNet
      init_args:
        architecture: r3d_18
        num_classes: 1
        pretrained: true
    tta: true
data:
  class_path: opendiagnostics.data.MedMNISTDataModule
  init_args:
    flag: synapsemnist3d
    size: 64
    root: data/medmnist
    split: predefined
    batch_size: 16
    eval_batch_size: 64
    num_workers: 8
    train_transforms:
      class_path: monai.transforms.Compose
      init_args:
        transforms:
        - class_path: monai.transforms.RandAffine
          init_args:
            prob: 0.8
            rotate_range:
            - 0.17
            - 0.17
            - 0.17
            scale_range:
            - 0.1
            - 0.1
            - 0.1
            translate_range:
            - 4
            - 4
            - 4
            padding_mode: border
        - class_path: monai.transforms.RandFlip
          init_args:
            prob: 0.5
            spatial_axis: 0
        - class_path: monai.transforms.RandFlip
          init_args:
            prob: 0.5
            spatial_axis: 1
        - class_path: monai.transforms.RandFlip
          init_args:
            prob: 0.5
            spatial_axis: 2
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.001
    weight_decay: 0.05
lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 100
    eta_min: 1.0e-06
checkpoint:
  monitor: val/auroc
  mode: max
eval:
  bootstrap_samples: 1000
