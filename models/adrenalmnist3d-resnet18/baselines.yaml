benchmark: AdrenalMNIST3D (MedMNIST v2), official test split of 298 volumes at 64³
protocol: 'Test AUROC and ACC on the official split, with the official medmnist evaluator''s definitions:
  AUROC is plain binary AUROC and ACC uses a 0.5 threshold (compare our accuracy_at_0.5). Our runs train
  and test on the 64³ volumes. The MedMNIST v2 rows use the 28³ volumes, so they are a weaker, lower-resolution
  reference, not a like-for-like comparison; they are means of at least 3 trials. The BSDA and cross-plane
  attention rows use 64³ and the official split. BSDA values are means of 3 seeds; the cross-plane attention
  paper does not say. Its Table 1 also lists other methods, copied from their papers without a stated
  resolution, so they are left out. No source publishes intervals or predictions, so a claim to beat one
  needs its value outside our 95% interval.'
baselines:
- method: Axial-centric cross-plane attention (64³)
  metrics:
    auroc: 0.92
    accuracy: 0.886
  source: Park et al., arXiv 2602.21636v1 (2026), Table 1
  url: https://arxiv.org/html/2602.21636v1
  notes: Frozen MedDINOv3 slice features, pretrained on 3.87M axial CT slices whose overlap with this
    subset's source is not stated. Seeds not stated.
- method: ResNet-18 + BSDA (64³), mean of 3 seeds
  metrics:
