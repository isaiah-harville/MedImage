# Kermany pediatric chest X-ray (normal vs pneumonia) at 448 px. Download the data first:
#   uv run python scripts/datasets/kermany_cxr.py data/kermany_cxr
#   uv run opendiagnostics fit -c models/kermany-cxr-convnext/config.yaml
name: kermany-cxr-convnext
notes: >-
  ConvNeXt-S at 448 px on the official 624-image test folder. Validation is fold 0 of 10
  patient-grouped, label-stratified folds of the official training folder. No flips: a chest
  has a left and a right. Batches of 16, four accumulated per step (64).
seed_everything: 0
trainer:
  accelerator: auto
  precision: bf16-mixed
  deterministic: warn
  max_epochs: 30
  accumulate_grad_batches: 4
  log_every_n_steps: 10
  callbacks:
  - class_path: lightning.pytorch.callbacks.EMAWeightAveraging
    init_args:
      decay: 0.9955
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
model:
  class_path: opendiagnostics.modules.ImageClassifier
  init_args:
    network:
      class_path: timm.create_model
      init_args:
        model_name: convnext_small.fb_in22k_ft_in1k
        pretrained: true
      dict_kwargs:
        num_classes: 1
        in_chans: 1
        drop_path_rate: 0.2
    tta: false
data:
  class_path: opendiagnostics.data.CSVImageDataModule
  init_args:
    manifest: data/kermany_cxr/manifest.csv
    split_column: split
    class_names: [NORMAL, PNEUMONIA]
    image_mode: L
    in_channels: 1
    license: CC BY 4.0
    citation: >-
      Kermany DS, Goldbaum M, Cai W, et al. Identifying Medical Diagnoses and Treatable
      Diseases by Image-Based Deep Learning. Cell 172(5):1122-1131.e9, 2018.
      doi:10.1016/j.cell.2018.02.010. Data: Kermany D, Zhang K, Goldbaum M, Mendeley Data v3,
      doi:10.17632/rscbjbr9sj.3.
    split: kfold
    folds: 10
    fold: 0
    batch_size: 16
    eval_batch_size: 64
    num_workers: 8
    train_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
        - class_path: torchvision.transforms.v2.RandomResizedCrop
          init_args:
            size: [448, 448]
            scale: [0.7, 1.0]
            antialias: true
        - class_path: torchvision.transforms.v2.RandomAffine
          init_args:
            degrees: 10
            translate: [0.05, 0.05]
        - class_path: torchvision.transforms.v2.Normalize
          init_args:
            mean: [0.449]
            std: [0.226]
    eval_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
        - class_path: torchvision.transforms.v2.Resize
          init_args:
            size: [448, 448]
            antialias: true
        - class_path: torchvision.transforms.v2.Normalize
          init_args:
            mean: [0.449]
            std: [0.226]
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.0001
    weight_decay: 0.05
lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 30
    eta_min: 1.0e-06
checkpoint:
  monitor: val/auroc
  mode: max
eval:
  bootstrap_samples: 1000
