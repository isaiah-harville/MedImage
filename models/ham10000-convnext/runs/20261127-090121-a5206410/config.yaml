# lightning.pytorch==2.6.6
seed_everything: 0
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: bf16-mixed
  logger: null
  callbacks:
  - class_path: lightning.pytorch.callbacks.EMAWeightAveraging
    init_args:
      device: null
      use_buffers: true
      decay: 0.999
      update_every_n_steps: 1
      update_starting_at_step: null
      update_starting_at_epoch: null
      multi_avg_fn: null
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
      log_momentum: false
      log_weight_decay: false
  fast_dev_run: false
  max_epochs: 30
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 50
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: warn
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
  enable_autolog_hparams: true
  model_registry: null
model:
  class_path: opendiagnostics.modules.ImageClassifier
  init_args:
    network:
      class_path: timm.create_model
      init_args:
        model_name: convnext_small.fb_in22k_ft_in1k_384
        pretrained: true
        pretrained_cfg: null
        pretrained_cfg_overlay: null
        checkpoint_path: null
        cache_dir: null
        scriptable: null
        exportable: null
        no_jit: null
      dict_kwargs:
        num_classes: 7
        in_chans: 3
        drop_path_rate: 0.2
    threshold: youden
    label_smoothing: 0.1
    pos_weight: null
    class_weight:
    - 4.375
    - 2.783
    - 1.302
    - 12.441
    - 1.285
    - 0.213
    - 10.075
    tta: true
    calibration_bins: 15
data:
  class_path: opendiagnostics.data.CSVImageDataModule
  init_args:
    manifest: data/ham10000/manifest.csv
    image_column: path
    label_column: label
    patient_column: patient_id
    split_column: split
    class_names:
    - akiec
    - bcc
    - bkl
    - df
    - mel
    - nv
    - vasc
    label_separator: null
    image_mode: null
    in_channels: 3
    license: CC BY-NC 4.0
    citation: Tschandl P, Rosendahl C, Kittler H. The HAM10000 dataset, a large collection
      of multi-source dermatoscopic images of common pigmented skin lesions. Sci Data
      5:180161 (2018). doi:10.1038/sdata.2018.161
    split: predefined
    fractions:
    - 0.7
    - 0.15
    - 0.15
    folds: 5
    fold: 0
    stratify: true
    split_seed: 0
    train_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
        - class_path: torchvision.transforms.v2.Resize
          init_args:
            size:
            - 384
            - 512
            interpolation: bilinear
            max_size: null
            antialias: true
        - class_path: torchvision.transforms.v2.RandomHorizontalFlip
          init_args:
            p: 0.5
        - class_path: torchvision.transforms.v2.RandomVerticalFlip
          init_args:
            p: 0.5
        - class_path: torchvision.transforms.v2.RandomAffine
          init_args:
            degrees: 180
            translate: null
            scale:
            - 0.9
            - 1.1
            shear: null
            interpolation: nearest
            fill: 0
            center: null
        - class_path: torchvision.transforms.v2.ColorJitter
          init_args:
            brightness: 0.1
            contrast: 0.1
            saturation: 0.1
            hue: null
        - class_path: torchvision.transforms.v2.Normalize
          init_args:
            mean:
            - 0.485
            - 0.456
            - 0.406
            std:
            - 0.229
            - 0.224
            - 0.225
            inplace: false
    eval_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
        - class_path: torchvision.transforms.v2.Resize
          init_args:
            size:
            - 384
            - 512
            interpolation: bilinear
            max_size: null
            antialias: true
        - class_path: torchvision.transforms.v2.Normalize
          init_args:
            mean:
            - 0.485
            - 0.456
            - 0.406
            std:
            - 0.229
            - 0.224
            - 0.225
            inplace: false
    batch_size: 16
    eval_batch_size: 64
    num_workers: 8
name: ham10000-convnext
output_dir: runs
notes: HAM10000 7-class diagnosis at 384x512 px. Lesion-level 85/15 train/val split;
  the test split is the ISIC 2018 Task 3 test set.
eval:
  bootstrap_samples: 1000
  confidence: 0.95
  bootstrap_unit: patient
  splits:
  - val
  - test
checkpoint:
  dirpath: null
  filename: checkpoint
  monitor: val/balanced_accuracy
  verbose: false
  save_last: null
  save_top_k: 1
  save_on_exception: false
  save_weights_only: true
  mode: max
  auto_insert_metric_name: false
  every_n_train_steps: null
  train_time_interval: null
  every_n_epochs: null
  save_on_train_epoch_end: null
  enable_version_counter: false
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.0001
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.05
    amsgrad: false
    maximize: false
    foreach: null
    capturable: false
    differentiable: false
    fused: null
lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 30
    eta_min: 1.0e-06
    last_epoch: -1
ckpt_path: null
weights_only: null
