# Prepare the data once: uv run python scripts/datasets/ham10000.py data/ham10000
#   uv run opendiagnostics fit -c models/ham10000-convnext/config.yaml
name: ham10000-convnext
notes: HAM10000 7-class diagnosis at 384x512 px. Lesion-level 85/15 train/val split; the test split is
  the ISIC 2018 Task 3 test set.
seed_everything: 0
trainer:
  accelerator: auto
  precision: bf16-mixed
  deterministic: warn
  max_epochs: 30
  log_every_n_steps: 50
  callbacks:
  - class_path: lightning.pytorch.callbacks.EMAWeightAveraging
    init_args:
      decay: 0.999
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
model:
  class_path: opendiagnostics.modules.ImageClassifier
  init_args:
    network:
      class_path: timm.create_model
      init_args:
        model_name: convnext_small.fb_in22k_ft_in1k_384
        pretrained: true
      dict_kwargs:
        num_classes: 7
        in_chans: 3
        drop_path_rate: 0.2
    tta: true
    label_smoothing: 0.1
data:
  class_path: opendiagnostics.data.CSVImageDataModule
  init_args:
    manifest: data/ham10000/manifest.csv
    split: predefined
    split_column: split
    class_names:
    - akiec
    - bcc
    - bkl
    - df
    - mel
    - nv
    - vasc
    in_channels: 3
    license: CC BY-NC 4.0
    citation: Tschandl P, Rosendahl C, Kittler H. The HAM10000 dataset, a large collection of multi-source
      dermatoscopic images of common pigmented skin lesions. Sci Data 5:180161 (2018). doi:10.1038/sdata.2018.161
    batch_size: 16
    eval_batch_size: 64
    num_workers: 8
    train_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
        - class_path: torchvision.transforms.v2.Resize
          init_args:
            size:
            - 384
            - 512
            antialias: true
        - class_path: torchvision.transforms.v2.RandomHorizontalFlip
        - class_path: torchvision.transforms.v2.RandomVerticalFlip
        - class_path: torchvision.transforms.v2.RandomAffine
          init_args:
            degrees: 180
            scale:
            - 0.9
            - 1.1
        - class_path: torchvision.transforms.v2.ColorJitter
          init_args:
            brightness: 0.1
            contrast: 0.1
            saturation: 0.1
        - class_path: torchvision.transforms.v2.Normalize
          init_args:
            mean:
            - 0.485
            - 0.456
            - 0.406
            std:
            - 0.229
            - 0.224
            - 0.225
    eval_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
        - class_path: torchvision.transforms.v2.Resize
          init_args:
            size:
            - 384
            - 512
            antialias: true
        - class_path: torchvision.transforms.v2.Normalize
          init_args:
            mean:
            - 0.485
            - 0.456
            - 0.406
            std:
            - 0.229
            - 0.224
            - 0.225
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.0001
    weight_decay: 0.05
lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 30
    eta_min: 1.0e-06
checkpoint:
  monitor: val/balanced_accuracy
  mode: max
eval:
  bootstrap_samples: 1000
