# Generated by scripts/medmnist_recipes.py. Edit the script, then rerun it.
#   uv run opendiagnostics fit -c models/organmnist3d-resnet18/config.yaml
name: organmnist3d-resnet18
notes: OrganMNIST3D at 64 voxels. Official split; MedMNIST has no patient IDs.
seed_everything: 0
trainer:
  accelerator: auto
  precision: bf16-mixed
  deterministic: warn
  max_epochs: 100
  log_every_n_steps: 50
  callbacks:
  - class_path: lightning.pytorch.callbacks.EMAWeightAveraging
    init_args:
      decay: 0.99836
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
model:
  class_path: opendiagnostics.modules.ImageClassifier
  init_args:
    network:
      class_path: monai.networks.nets.ResNet
      init_args:
        block: basic
        layers:
        - 2
        - 2
        - 2
        - 2
        block_inplanes:
        - 64
        - 128
        - 256
        - 512
        spatial_dims: 3
        n_input_channels: 1
        num_classes: 11
    tta: false
    label_smoothing: 0.1
data:
  class_path: opendiagnostics.data.MedMNISTDataModule
  init_args:
    flag: organmnist3d
    size: 64
    root: data/medmnist
    split: predefined
    batch_size: 16
    eval_batch_size: 64
    num_workers: 8
    train_transforms:
      class_path: monai.transforms.Compose
      init_args:
        transforms:
        - class_path: monai.transforms.RandAffine
          init_args:
            prob: 0.8
            rotate_range:
            - 0.17
            - 0.17
            - 0.17
            scale_range:
            - 0.1
            - 0.1
            - 0.1
            translate_range:
            - 4
            - 4
            - 4
            padding_mode: border
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.001
    weight_decay: 0.05
lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 100
    eta_min: 1.0e-06
checkpoint:
  monitor: val/auroc
  mode: max
eval:
  bootstrap_samples: 1000
