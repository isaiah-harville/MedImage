benchmark: CAMELYON16 slide-level metastasis classification, official test set of 129 slides
protocol: >-
  Train on the official 270 training slides, report slide-level AUROC (tumor vs normal) on
  the official test set (test_049 removed, 129 slides: 49 tumor, 80 normal). Accuracy is at a
  0.5 threshold; compare our accuracy_at_0.5. CAMELYON16 has no patient IDs, so our
  intervals resample slides. JAMA 2017 rows are single challenge submissions (Task 2) and
  pathologists, with percentile-bootstrap 95% intervals in the paper; challenge entries could
  train on the pixel-level tumour annotations, which our slide-label MIL does not. TransMIL
  and DSMIL give no run count; DTFD-MIL values are means of 5 runs. TransMIL and our runs use
  ImageNet ResNet-50 layer-3 features; DTFD-MIL uses ResNet-50 features (pretraining is in its
  supplement, not checked); DSMIL rows use SimCLR ResNet-18 features trained on CAMELYON16.
  No source publishes predictions, so a claim to beat one needs its value outside our 95%
  interval.
