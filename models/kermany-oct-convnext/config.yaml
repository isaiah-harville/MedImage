# Kermany retinal OCT (CNV, DME, drusen, normal) at 448 px. Download the data first:
#   uv run python scripts/datasets/kermany_oct.py data/kermany_oct
#   uv run opendiagnostics fit -c models/kermany-oct-convnext/config.yaml
name: kermany-oct-convnext
notes: >-
  ConvNeXt-S at 448 px on the official 1,000-image test folder. Validation is fold 0 of 10
  patient-grouped, label-stratified folds of the official training folder. Checkpoints are
  chosen on validation accuracy, the benchmark's metric. Batches of 16, four accumulated per
  step (64).
seed_everything: 0
trainer:
  accelerator: auto
  precision: bf16-mixed
  deterministic: warn
  max_epochs: 10
  accumulate_grad_batches: 4
  log_every_n_steps: 50
  callbacks:
  - class_path: lightning.pytorch.callbacks.EMAWeightAveraging
    init_args:
      decay: 0.99934
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
model:
  class_path: opendiagnostics.modules.ImageClassifier
  init_args:
    network:
      class_path: timm.create_model
      init_args:
        model_name: convnext_small.fb_in22k_ft_in1k
        pretrained: true
      dict_kwargs:
        num_classes: 4
        in_chans: 1
        drop_path_rate: 0.2
    tta: true
    label_smoothing: 0.1
data:
  class_path: opendiagnostics.data.CSVImageDataModule
  init_args:
    manifest: data/kermany_oct/manifest.csv
    split_column: split
    class_names: [CNV, DME, DRUSEN, NORMAL]
    image_mode: L
    in_channels: 1
    license: CC BY 4.0
    citation: >-
      Kermany DS, Goldbaum M, Cai W, et al. Identifying Medical Diagnoses and Treatable
      Diseases by Image-Based Deep Learning. Cell 172(5):1122-1131.e9, 2018.
      doi:10.1016/j.cell.2018.02.010. Data: Kermany D, Zhang K, Goldbaum M, Mendeley Data v3,
      doi:10.17632/rscbjbr9sj.3.
    split: kfold
    folds: 10
    fold: 0
    batch_size: 16
    eval_batch_size: 64
    num_workers: 8
    train_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
        - class_path: torchvision.transforms.v2.RandomResizedCrop
          init_args:
            size: [448, 448]
            scale: [0.7, 1.0]
            antialias: true
        - class_path: torchvision.transforms.v2.RandomHorizontalFlip
        - class_path: torchvision.transforms.v2.RandomVerticalFlip
        - class_path: torchvision.transforms.v2.Normalize
          init_args:
            mean: [0.449]
            std: [0.226]
    eval_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
        - class_path: torchvision.transforms.v2.Resize
          init_args:
            size: [448, 448]
            antialias: true
        - class_path: torchvision.transforms.v2.Normalize
          init_args:
            mean: [0.449]
            std: [0.226]
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.0001
    weight_decay: 0.05
lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 10
    eta_min: 1.0e-06
checkpoint:
  monitor: val/accuracy
  mode: max
eval:
  bootstrap_samples: 1000
