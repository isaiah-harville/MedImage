# Generated by scripts/segmentation_recipes.py. Edit the script, then rerun it.
#   uv run opendiagnostics fit -c models/picai-dynunet/config.yaml
name: picai-dynunet
notes: PI-CAI public studies with expert csPCa masks. Hidden test labels, so studies are split 70/10/20
  by patient. Dice is over studies with a lesion.
seed_everything: 0
trainer:
  accelerator: auto
  precision: bf16-mixed
  deterministic: warn
  max_epochs: 48
  check_val_every_n_epoch: 2
  gradient_clip_val: 12.0
  log_every_n_steps: 50
  callbacks:
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
model:
  class_path: opendiagnostics.modules.SegmentationModule
  init_args:
    patch_size:
    - 256
    - 256
    - 20
    network:
      class_path: monai.networks.nets.DynUNet
      init_args:
        spatial_dims: 3
        in_channels: 3
        out_channels: 2
        kernel_size:
        - - 3
          - 3
          - 1
        - - 3
          - 3
          - 1
        - - 3
          - 3
          - 3
        - - 3
          - 3
          - 3
        - - 3
          - 3
          - 3
        - - 3
          - 3
          - 3
        strides:
        - - 1
          - 1
          - 1
        - - 2
          - 2
          - 1
        - - 2
          - 2
          - 1
        - - 2
          - 2
          - 2
        - - 2
          - 2
          - 2
        - - 2
          - 2
          - 1
        upsample_kernel_size:
        - - 2
          - 2
          - 1
        - - 2
          - 2
          - 1
        - - 2
          - 2
          - 2
        - - 2
          - 2
          - 2
        - - 2
          - 2
          - 1
        norm_name: instance
        res_block: true
    sw_batch_size: 2
    overlap: 0.5
    ignore_empty: true
data:
  class_path: opendiagnostics.data.NiftiSegmentationDataModule
  init_args:
    manifest: data/picai/manifest.csv
    class_names:
    - background
    - cspca
    image_columns:
    - image_t2w
    - image_adc
    - image_hbv
    in_channels: 3
    patient_ids_available: true
    license: CC BY-NC 4.0
    citation: Saha, A. et al. Artificial intelligence and radiologists in prostate cancer detection on
      MRI (PI-CAI). Lancet Oncology 25, 879-887 (2024). https://doi.org/10.1016/S1470-2045(24)00220-1
    split: predefined
    batch_size: 1
    num_workers: 6
    cache_dir: data/cache/picai
    train_transforms:
      class_path: monai.transforms.Compose
      init_args:
        transforms:
        - class_path: monai.transforms.Orientationd
          init_args:
            keys:
            - image
            - label
            axcodes: RAS
            labels:
            - - L
              - R
            - - P
              - A
            - - I
              - S
        - class_path: monai.transforms.Spacingd
          init_args:
            keys:
            - image
            - label
            pixdim:
            - 0.5
            - 0.5
            - 3.0
            mode:
            - bilinear
            - nearest
        - class_path: monai.transforms.NormalizeIntensityd
          init_args:
            keys:
            - image
            nonzero: true
            channel_wise: true
        - class_path: monai.transforms.CastToTyped
          init_args:
            keys:
            - image
            dtype: float16
        - class_path: monai.transforms.SpatialPadd
          init_args:
            keys:
            - image
            - label
            spatial_size:
            - 256
            - 256
            - 20
        - class_path: monai.transforms.RandCropByPosNegLabeld
          init_args:
            keys:
            - image
            - label
            label_key: label
            spatial_size:
            - 256
            - 256
            - 20
            pos: 1.0
            neg: 1.0
            num_samples: 2
        - class_path: monai.transforms.RandFlipd
          init_args:
            keys:
            - image
            - label
            prob: 0.5
            spatial_axis: 0
        - class_path: monai.transforms.RandScaleIntensityd
          init_args:
            keys:
            - image
            factors: 0.1
            prob: 0.5
        - class_path: monai.transforms.RandShiftIntensityd
          init_args:
            keys:
            - image
            offsets: 0.1
            prob: 0.5
    eval_transforms:
      class_path: monai.transforms.Compose
      init_args:
        transforms:
        - class_path: monai.transforms.Orientationd
          init_args:
            keys:
            - image
            - label
            axcodes: RAS
            labels:
            - - L
              - R
            - - P
              - A
            - - I
              - S
        - class_path: monai.transforms.Spacingd
          init_args:
            keys:
            - image
            pixdim:
            - 0.5
            - 0.5
            - 3.0
            mode: bilinear
        - class_path: monai.transforms.NormalizeIntensityd
          init_args:
            keys:
            - image
            nonzero: true
            channel_wise: true
        - class_path: monai.transforms.CastToTyped
          init_args:
            keys:
            - image
            dtype: float16
optimizer:
  class_path: torch.optim.SGD
  init_args:
    lr: 0.01
    momentum: 0.99
    nesterov: true
    weight_decay: 3.0e-05
lr_scheduler:
  class_path: torch.optim.lr_scheduler.PolynomialLR
  init_args:
    total_iters: 48
    power: 0.9
checkpoint:
  monitor: val/dice
  mode: max
eval:
  bootstrap_samples: 1000
