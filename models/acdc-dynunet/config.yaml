# Generated by scripts/segmentation_recipes.py. Edit the script, then rerun it.
#   uv run opendiagnostics fit -c models/acdc-dynunet/config.yaml
name: acdc-dynunet
notes: ACDC end-diastole and end-systole frames. Official test split (50 patients); the 100 training patients
  are split 80/20 into train and validation.
seed_everything: 0
trainer:
  accelerator: auto
  precision: bf16-mixed
  deterministic: warn
  max_epochs: 625
  check_val_every_n_epoch: 31
  gradient_clip_val: 12.0
  log_every_n_steps: 50
  callbacks:
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
model:
  class_path: opendiagnostics.modules.SegmentationModule
  init_args:
    patch_size:
    - 192
    - 192
    - 16
    network:
      class_path: monai.networks.nets.DynUNet
      init_args:
        spatial_dims: 3
        in_channels: 1
        out_channels: 4
        kernel_size:
        - - 3
          - 3
          - 1
        - - 3
          - 3
          - 1
        - - 3
          - 3
          - 3
        - - 3
          - 3
          - 3
        - - 3
          - 3
          - 3
        - - 3
          - 3
          - 3
        strides:
        - - 1
          - 1
          - 1
        - - 2
          - 2
          - 1
        - - 2
          - 2
          - 1
        - - 2
          - 2
          - 2
        - - 2
          - 2
          - 2
        - - 2
          - 2
          - 1
        upsample_kernel_size:
        - - 2
          - 2
          - 1
        - - 2
          - 2
          - 1
        - - 2
          - 2
          - 2
        - - 2
          - 2
          - 2
        - - 2
          - 2
          - 1
        norm_name: instance
        res_block: true
    sw_batch_size: 2
    overlap: 0.5
data:
  class_path: opendiagnostics.data.NiftiSegmentationDataModule
  init_args:
    manifest: data/acdc/manifest.csv
    class_names:
    - background
    - right_ventricle
    - myocardium
    - left_ventricle
    image_columns:
    - image
    in_channels: 1
    patient_ids_available: true
    license: CC BY-NC-SA 4.0
    citation: 'Bernard, O. et al. Deep Learning Techniques for Automatic MRI Cardiac Multi-Structures
      Segmentation and Diagnosis: Is the Problem Solved? IEEE TMI 37(11), 2514-2525 (2018). https://doi.org/10.1109/TMI.2018.2837502'
    split: predefined
    batch_size: 2
    num_workers: 6
    cache_dir: data/cache/acdc
    train_transforms:
      class_path: monai.transforms.Compose
      init_args:
        transforms:
        - class_path: monai.transforms.Orientationd
          init_args:
            keys:
            - image
            - label
            axcodes: RAS
            labels:
            - - L
              - R
            - - P
              - A
            - - I
              - S
        - class_path: monai.transforms.Spacingd
          init_args:
            keys:
            - image
            - label
            pixdim:
            - 1.5
            - 1.5
            - 5.0
            mode:
            - bilinear
            - nearest
        - class_path: monai.transforms.NormalizeIntensityd
          init_args:
            keys:
            - image
            nonzero: true
            channel_wise: true
        - class_path: monai.transforms.CastToTyped
          init_args:
            keys:
            - image
            dtype: float16
        - class_path: monai.transforms.SpatialPadd
          init_args:
            keys:
            - image
            - label
            spatial_size:
            - 192
            - 192
            - 16
        - class_path: monai.transforms.RandCropByPosNegLabeld
          init_args:
            keys:
            - image
            - label
            label_key: label
            spatial_size:
            - 192
            - 192
            - 16
            pos: 1.0
            neg: 1.0
            num_samples: 2
        - class_path: monai.transforms.RandFlipd
          init_args:
            keys:
            - image
            - label
            prob: 0.5
            spatial_axis: 0
        - class_path: monai.transforms.RandFlipd
          init_args:
            keys:
            - image
            - label
            prob: 0.5
            spatial_axis: 1
        - class_path: monai.transforms.RandFlipd
          init_args:
            keys:
            - image
            - label
            prob: 0.5
            spatial_axis: 2
        - class_path: monai.transforms.RandScaleIntensityd
          init_args:
            keys:
            - image
            factors: 0.1
            prob: 0.5
        - class_path: monai.transforms.RandShiftIntensityd
          init_args:
            keys:
            - image
            offsets: 0.1
            prob: 0.5
    eval_transforms:
      class_path: monai.transforms.Compose
      init_args:
        transforms:
        - class_path: monai.transforms.Orientationd
          init_args:
            keys:
            - image
            - label
            axcodes: RAS
            labels:
            - - L
              - R
            - - P
              - A
            - - I
              - S
        - class_path: monai.transforms.Spacingd
          init_args:
            keys:
            - image
            pixdim:
            - 1.5
            - 1.5
            - 5.0
            mode: bilinear
        - class_path: monai.transforms.NormalizeIntensityd
          init_args:
            keys:
            - image
            nonzero: true
            channel_wise: true
        - class_path: monai.transforms.CastToTyped
          init_args:
            keys:
            - image
            dtype: float16
optimizer:
  class_path: torch.optim.SGD
  init_args:
    lr: 0.01
    momentum: 0.99
    nesterov: true
    weight_decay: 3.0e-05
lr_scheduler:
  class_path: torch.optim.lr_scheduler.PolynomialLR
  init_args:
    total_iters: 625
    power: 0.9
checkpoint:
  monitor: val/dice
  mode: max
eval:
  bootstrap_samples: 1000
