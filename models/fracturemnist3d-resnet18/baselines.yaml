benchmark: FractureMNIST3D (MedMNIST v2), official test split of 240 volumes at 64³
protocol: 'Test AUROC and ACC on the official split, with the official medmnist evaluator''s definitions:
  AUROC is one-vs-rest macro and ACC is argmax. Our runs train and test on the 64³ volumes. The MedMNIST
  v2 rows use the 28³ volumes, so they are a weaker, lower-resolution reference, not a like-for-like comparison;
  they are means of at least 3 trials. The BSDA and cross-plane attention rows use 64³ and the official
  split. BSDA values are means of 3 seeds; the cross-plane attention paper does not say. Its Table 1 also
  lists other methods, copied from their papers without a stated resolution, so they are left out. No
  source publishes intervals or predictions, so a claim to beat one needs its value outside our 95% interval.'
baselines:
- method: ResNet-50 + ACS (28³), mean of at least 3 trials
  metrics:
    auroc: 0.75
    accuracy: 0.517
  source: Yang et al., Scientific Data 10:41 (2023), Table 4
  url: https://www.nature.com/articles/s41597-022-01721-8/tables/4
- method: ResNet-18 + BSDA (64³), mean of 3 seeds
  metrics:
