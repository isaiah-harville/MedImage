# Generated by scripts/medmnist_recipes.py. Edit the script, then rerun it.
#   uv run opendiagnostics fit -c models/pneumoniamnist-convnext/config.yaml
name: pneumoniamnist-convnext
notes: PneumoniaMNIST at 224 px. Official split; MedMNIST has no patient IDs.
seed_everything: 0
trainer:
  accelerator: auto
  precision: bf16-mixed
  deterministic: warn
  max_epochs: 40
  log_every_n_steps: 50
  callbacks:
  - class_path: lightning.pytorch.callbacks.EMAWeightAveraging
    init_args:
      decay: 0.99662
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
model:
  class_path: opendiagnostics.modules.ImageClassifier
  init_args:
    network:
      class_path: timm.create_model
      init_args:
        model_name: convnext_small.fb_in22k_ft_in1k
        pretrained: true
      dict_kwargs:
        num_classes: 1
        in_chans: 1
        drop_path_rate: 0.2
    tta: false
data:
  class_path: opendiagnostics.data.MedMNISTDataModule
  init_args:
    flag: pneumoniamnist
    size: 224
    split: predefined
    batch_size: 64
    eval_batch_size: 256
    num_workers: 8
    train_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
        - class_path: torchvision.transforms.v2.RandomResizedCrop
          init_args:
            size: 224
            scale:
            - 0.7
            - 1.0
            antialias: true
        - class_path: torchvision.transforms.v2.RandomAffine
          init_args:
            degrees: 10
            translate:
            - 0.05
            - 0.05
        - class_path: torchvision.transforms.v2.Normalize
          init_args:
            mean:
            - 0.449
            std:
            - 0.226
    eval_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
        - class_path: torchvision.transforms.v2.Resize
          init_args:
            size: 224
            antialias: true
        - class_path: torchvision.transforms.v2.Normalize
          init_args:
            mean:
            - 0.449
            std:
            - 0.226
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.0001
    weight_decay: 0.05
lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 40
    eta_min: 1.0e-06
checkpoint:
  monitor: val/auroc
  mode: max
eval:
  bootstrap_samples: 1000
