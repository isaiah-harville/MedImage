name: pneumoniamnist-cnn
task:
  name: classification
  params:
    threshold: youden
data:
  dataset:
    name: medmnist
    params:
      subset: pneumoniamnist
      size: 64
      download: true
  split:
    method: predefined
    fractions:
    - 0.7
    - 0.15
    - 0.15
    stratify: true
    seed: null
  train_transforms:
  - name: random_flip
    params:
      axes:
      - -1
      p: 0.5
  - name: random_intensity
    params:
      scale: 0.1
      shift: 0.05
      p: 0.5
  - name: normalize
    params:
      mean:
      - 0.5
      std:
      - 0.25
  eval_transforms:
  - name: normalize
    params:
      mean:
      - 0.5
      std:
      - 0.25
  batch_size: 64
  eval_batch_size: 256
  num_workers: 0
model:
  name: simple_cnn
  params:
    width: 16
    depth: 4
    dropout: 0.2
optim:
  name: adamw
  lr: 0.002
  weight_decay: 0.0001
  momentum: 0.9
  scheduler: cosine
  warmup_epochs: 1
  step_size: 10
  gamma: 0.1
train:
  epochs: 10
  device: cpu
  amp: false
  grad_clip_norm: null
  monitor: auroc
  monitor_mode: max
  early_stopping_patience: null
  log_every: 0
  max_steps_per_epoch: null
eval:
  bootstrap_samples: 2000
  confidence: 0.95
  bootstrap_unit: patient
  splits:
  - val
  - test
seed: 0
deterministic: strict
output_dir: runs
plugins: []
notes: 'Worked example of the full pipeline on open data that needs no credentials.
  A benchmark of the pipeline, not a clinical model.

  '
