benchmark: TissueMNIST (MedMNIST v2), official test split of 47,280 images
protocol: >-
  Test AUROC and ACC on the official split, with the official medmnist evaluator's
  definitions: AUROC is one-vs-rest macro for multiclass, macro over labels for ChestMNIST, and
  plain for binary; ACC is argmax for multiclass and a 0.5 threshold for binary and ChestMNIST
  (compare our accuracy_at_0.5 for binary subsets). Our runs train and test on the native 224 px
  MedMNIST+ images, so the MedMNIST+ native-224 rows are the like-for-like comparison. MedMNIST
  v2 "224" rows and both MedViT papers use 28 px images upscaled. MedMNIST+ values are means of
  3 seeds; MedMNIST v2 values are means of at least 3 trials; the MedViT papers do not say. No
  source publishes intervals or predictions, so a claim to beat one needs its value outside our
  95% interval. MedViTV2's Table 5 misquotes several MedMNIST v2 rows, so treat its own numbers
  with care. auroc_sd and accuracy_sd are the standard deviations over runs that a source
  publishes next to its mean.
