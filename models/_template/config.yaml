# Copy this directory to models/<dataset>-<model>/ and edit.
#   uv run opendiagnostics fit -c models/<name>/config.yaml
name: CHANGE-ME
notes: ""
seed_everything: 0
trainer:
  accelerator: auto
  precision: bf16-mixed
  deterministic: warn
  max_epochs: 20
  callbacks:
    - class_path: lightning.pytorch.callbacks.EMAWeightAveraging
      init_args: {decay: 0.999}
model:
  class_path: opendiagnostics.modules.ImageClassifier
  init_args:
    network:
      class_path: timm.create_model
      init_args: {model_name: convnext_small.fb_in22k_ft_in1k, pretrained: true}
      dict_kwargs: {num_classes: 1, in_chans: 1}
data:
  class_path: opendiagnostics.data.CSVImageDataModule
  init_args:
    manifest: /path/to/labels.csv
    patient_column: patient_id
    split: patient
    fractions: [0.7, 0.15, 0.15]
    batch_size: 32
    num_workers: 8
    train_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
          - class_path: torchvision.transforms.v2.Resize
            init_args: {size: [224, 224], antialias: true}
          - class_path: torchvision.transforms.v2.RandomHorizontalFlip
    eval_transforms:
      class_path: torchvision.transforms.v2.Resize
      init_args: {size: [224, 224], antialias: true}
optimizer:
  class_path: torch.optim.AdamW
  init_args: {lr: 1.0e-4, weight_decay: 0.05}
lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args: {T_max: 20}
eval: {bootstrap_samples: 2000}
